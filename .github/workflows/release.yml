name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/fuzoo.dmg build/fuzoo.zip --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" build/fuzoo.dmg build/fuzoo.zip --clobber
